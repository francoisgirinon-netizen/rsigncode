on:
  push:
    branches: [main]

name: Release PR

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release-pr
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release PR is opened with GITHUB_TOKEN: its pull_request runs wait for an approval,
      # and merging it from here starts no push run. So this run approves them, waits for the
      # required checks, merges, and releases below.
      - name: Merge the release PR once its checks pass
        if: steps.release-pr.outputs.pr != '' && steps.release-pr.outputs.pr != '{}'
        run: |
          number=$(jq -r .number <<<"$PR")
          sha=$(gh pr view "$number" --json headRefOid -q .headRefOid)
          for attempt in $(seq 30); do
            runs=$(gh run list --commit "$sha" --event pull_request --json databaseId,conclusion,workflowName)
            for id in $(jq -r '.[] | select(.conclusion == "action_required") | .databaseId' <<<"$runs"); do
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve"
            done
            [ "$(jq '[.[].workflowName] | unique | length' <<<"$runs")" -ge 4 ] && break
            sleep 10
          done
          # Right after the approval the checks may not be reported yet.
          for attempt in $(seq 10); do
            gh pr checks "$number" --required --watch --interval 30 && break
            sleep 30
          done
          gh pr merge "$number" --rebase
          git fetch origin main
          git reset --hard origin/main
        env:
          PR: ${{ steps.release-pr.outputs.pr }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(jq -r '[.[] | select(.tag | startswith("v"))][0].tag // empty' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  # A tag pushed with GITHUB_TOKEN does not start release.yml on its own.
  binaries:
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-plz.outputs.tag }}
