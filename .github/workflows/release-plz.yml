on:
  push:
    branches: [main]
  # The release PR is opened with GITHUB_TOKEN: merging it from here does not start a push
  # run, so this workflow merges it and releases in the same run once its checks pass.
  workflow_run:
    workflows: [CI, Security, Benchmarks, SignTool oracle]
    types: [completed]

name: Release PR

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge-release-pr:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'release-plz-')
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
      cancel-in-progress: false
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # Fails while other required checks are still running; the last one to pass merges.
      - id: merge
        run: |
          if gh pr merge "$BRANCH" --rebase --repo "$GITHUB_REPOSITORY"; then
            echo merged=true >> "$GITHUB_OUTPUT"
          fi
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz:
    needs: merge-release-pr
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.merge-release-pr.outputs.merged == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release-pr
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A PR opened with GITHUB_TOKEN starts no workflow, so its required checks would never
      # report: run them on the release branch.
      - name: Run the checks on the release PR
        if: steps.release-pr.outputs.pr != '' && steps.release-pr.outputs.pr != '{}'
        run: |
          branch=$(jq -r .head_branch <<<"$PR")
          for workflow in ci.yml security.yml benchmarks.yml signtool-oracle.yml; do
            gh workflow run "$workflow" --ref "$branch" --repo "$GITHUB_REPOSITORY"
          done
        env:
          PR: ${{ steps.release-pr.outputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(jq -r '[.[] | select(.tag | startswith("v"))][0].tag // empty' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  # A tag pushed with GITHUB_TOKEN does not start release.yml on its own.
  binaries:
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-plz.outputs.tag }}
