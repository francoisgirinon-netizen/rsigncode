on:
  push:
    branches: [main]

name: Release PR

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: release-plz/action@v0.5
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$(jq -r '[.[] | select(.tag | startswith("v"))][0].tag // empty' <<<"$RELEASES")" >> "$GITHUB_OUTPUT"
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  # A tag pushed with GITHUB_TOKEN does not start release.yml on its own.
  binaries:
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-plz.outputs.tag }}
