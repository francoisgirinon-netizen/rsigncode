on:
  push:
    branches: [main]

name: Version

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    concurrency:
      group: version
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      # Only feat, fix, perf and breaking changes make a release; git-cliff alone would bump
      # the patch for any commit (docs, ci...).
      - id: next
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if ! git log --format='%s%n%b' ${last:+"$last..HEAD"} |
            grep -qE '^(feat|fix|perf)(\(.+\))?!?: |^[a-z]+(\(.+\))?!: |^BREAKING[ -]CHANGE: '; then
            echo "Nothing to release since ${last:-the first commit}"
            exit 0
          fi
          tag=$(git cliff --bumped-version)
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A tag pushed with GITHUB_TOKEN does not start release.yml on its own.
  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
