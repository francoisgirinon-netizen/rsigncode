on:
  push:
    branches:
      - main
  pull_request:

name: CI

env:
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request cancels the run of the previous one; runs on main and
  # scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # aws-lc-rs (default hashing backend) compiles C and, on Windows, assembly: it needs
      # MSVC (present on the runner) and NASM.
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  openssl:
    # `openssl smime -verify` checks the signatures of rsigncode, and the one of SignTool as a
    # control, but only from OpenSSL 3.5: the runners of Linux have 3.0, macOS has LibreSSL.
    # Homebrew has a recent OpenSSL; the test fails, instead of skipping, if it is too old.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: brew install openssl@3
      - name: Verify the signatures with OpenSSL
        run: |
          export OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL" version
          RSIGNCODE_REQUIRE_OPENSSL=1 cargo test -p rsigncode --test cms

  test-pure-rust:
    # Pure Rust hashing backend (RustCrypto), no C compiler needed.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-default-features --features pure-rust

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - run: rustup default 1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        run: |
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" > msg
            .githooks/commit-msg msg
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --features pure-rust -- -D warnings

  coverage:
    # All the lines must be covered by the tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --fail-under-lines 100
