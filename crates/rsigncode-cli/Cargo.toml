[package]
name = "rsigncode-cli"
description = "Command line tool to sign and verify files with Authenticode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rsigncode"
path = "src/main.rs"

[features]
default = ["aws-lc"]
aws-lc = ["rsigncode/aws-lc"]
pure-rust = ["rsigncode/pure-rust"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rsigncode = { path = "../rsigncode", default-features = false }

[lints]
workspace = true
