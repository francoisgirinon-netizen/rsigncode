[package]
name = "rsigncode"
description = "Authenticode signing and verification in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["aws-lc"]
# Hashing backend: aws-lc-rs (assembly, faster than RustCrypto on CPUs without the SHA
# extensions; needs a C compiler to build) ...
aws-lc = ["dep:aws-lc-rs"]
# ... or pure Rust (RustCrypto sha1 and sha2). Used when `aws-lc` is disabled.
pure-rust = ["dep:sha1", "dep:sha2"]

[dependencies]
aws-lc-rs = { version = "1.18", optional = true }
der = "0.8"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
pkcs8 = "0.11"
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["std", "encoding"] }
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
x509-cert = "0.3"

[dev-dependencies]
codspeed-criterion-compat = "5.0.2"
memmap2 = "0.9.11"

[[bench]]
name = "pe"
harness = false

[lints]
workspace = true
