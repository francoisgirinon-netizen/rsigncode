[workspace]
members = ["crates/rsigncode", "crates/rsigncode-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Francois Girinon <francois.girinon@arturia.com>"]
repository = "https://github.com/francoisgirinon-netizen/rsigncode"

[profile.release]
lto = true
codegen-units = 1
strip = true

# CodSpeed builds the benchmarks with this profile: without symbols its flamegraphs are
# unreadable ("too much time spent in runtime internals").
[profile.bench]
strip = false
debug = true

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
