# cargo-deny: known vulnerabilities, licenses, duplicate crates and sources.

[advisories]
# Vulnerabilities and unmaintained or yanked crates fail the check.
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
